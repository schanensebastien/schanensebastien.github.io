name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "scripts/indexnow-submit.js"
      - "scripts/indexnow.json"
      - "3fd1942cbe37480cb97ea59c0257bbe8.txt"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Submit git diff or every sitemap URL"
        type: choice
        options:
          - diff
          - sitemap
        default: diff

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for GitHub Pages
        run: sleep 45

      - name: Submit changed URLs
        if: github.event_name == 'push' || github.event.inputs.mode == 'diff'
        run: node scripts/indexnow-submit.js --from-git

      - name: Submit sitemap URLs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sitemap'
        run: node scripts/indexnow-submit.js --sitemap
